<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .geom-shape {
        fill: none;
        stroke: #0284C7;
        stroke-width: 0.85;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.12;
      }
      .geom-node {
        fill: #0284C7;
        opacity: 0.15;
      }
    </style>
  </defs>

  <!-- Spacious, Minimalist Octagon Outline (No Fill, Single Hairline Stroke) -->
  <polygon points="28,0 68,0 96,28 96,68 68,96 28,96 0,68 0,28" class="geom-shape" />

  <!-- Subtle Micro Dots at Corner Intersections -->
  <circle cx="0" cy="0" r="1.2" class="geom-node" />
  <circle cx="96" cy="0" r="1.2" class="geom-node" />
  <circle cx="0" cy="96" r="1.2" class="geom-node" />
  <circle cx="96" cy="96" r="1.2" class="geom-node" />
</svg>
