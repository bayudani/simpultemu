    <!-- Spike 9 (x: 290) -->
    <g transform="translate(290, 26)">
        <ellipse cx="-3.5" cy="-2" rx="3.2" ry="1.8" fill="url(#lavenderGrad)" transform="rotate(-20)"/>
        <ellipse cx="3.5" cy="-3" rx="3.2" ry="1.8" fill="url(#lavenderLight)" transform="rotate(20)"/>
        <ellipse cx="-3" cy="-7" rx="2.8" ry="1.6" fill="url(#lavenderLight)"/>
        <ellipse cx="3" cy="-8" rx="2.8" ry="1.6" fill="url(#lavenderGrad)"/>
        <ellipse cx="0" cy="-13" rx="2.2" ry="2.8" fill="url(#lavenderLight)"/>
