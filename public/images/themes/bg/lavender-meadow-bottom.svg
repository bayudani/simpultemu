    <!-- Spike 15 (x: 526) -->
    <g transform="translate(526, 26)">
        <ellipse cx="-3.5" cy="-2" rx="3" ry="1.8" fill="url(#lavenderGrad)" transform="rotate(-20)"/>
        <ellipse cx="3.5" cy="-3" rx="3" ry="1.8" fill="url(#lavenderLight)" transform="rotate(20)"/>
        <ellipse cx="0" cy="-11" rx="2.2" ry="2.8" fill="url(#lavenderLight)"/>
    </g>

    <!-- Spike 16 (Tall, x: 562) -->
    <g transform="translate(562, 16)">
        <ellipse cx="-4" cy="0" rx="3.8" ry="2.2" fill="url(#lavenderGrad)" transform="rotate(-25)"/>
        <ellipse cx="4" cy="-1" rx="3.8" ry="2.2" fill="url(#lavenderLight)" transform="rotate(25)"/>
        <ellipse cx="-3.5" cy="-6" rx="3.4" ry="1.9" fill="url(#lavenderLight)" transform="rotate(-20)"/>
        <ellipse cx="3.5" cy="-7" rx="3.4" ry="1.9" fill="url(#lavenderGrad)" transform="rotate(20)"/>
        <ellipse cx="0" cy="-14" rx="2.4" ry="3" fill="url(#lavenderLight)"/>
