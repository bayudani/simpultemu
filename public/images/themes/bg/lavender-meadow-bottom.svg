    <g transform="translate(415, 15)">
        <ellipse cx="-4.5" cy="0" rx="4" ry="2.2" fill="url(#lavenderGrad)" transform="rotate(-30)"/>
        <ellipse cx="4.5" cy="-1" rx="4" ry="2.2" fill="url(#lavenderLight)" transform="rotate(30)"/>
        <ellipse cx="-4" cy="-6" rx="3.6" ry="2" fill="url(#lavenderLight)" transform="rotate(-25)"/>
        <ellipse cx="4" cy="-7" rx="3.6" ry="2" fill="url(#lavenderGrad)" transform="rotate(25)"/>
        <ellipse cx="-3" cy="-12" rx="3.2" ry="1.8" fill="url(#lavenderGrad)" transform="rotate(-20)"/>
        <ellipse cx="3" cy="-13" rx="3.2" ry="1.8" fill="url(#lavenderLight)" transform="rotate(20)"/>
        <ellipse cx="0" cy="-18" rx="2.5" ry="3.5" fill="url(#lavenderLight)"/>
    </g>

    <!-- Spike 13 (x: 452) -->
    <g transform="translate(452, 30)">
        <ellipse cx="-3.5" cy="-2" rx="3" ry="1.8" fill="url(#lavenderLight)" transform="rotate(-20)"/>
        <ellipse cx="3.5" cy="-3" rx="3" ry="1.8" fill="url(#lavenderGrad)" transform="rotate(20)"/>
        <ellipse cx="0" cy="-10" rx="2.2" ry="2.8" fill="url(#lavenderLight)"/>
    </g>

    <!-- Spike 14 (x: 490) -->
    <g transform="translate(490, 18)">
        <ellipse cx="-4" cy="-1" rx="3.6" ry="2" fill="url(#lavenderGrad)" transform="rotate(-25)"/>
        <ellipse cx="4" cy="-2" rx="3.6" ry="2" fill="url(#lavenderLight)" transform="rotate(25)"/>
        <ellipse cx="-3.5" cy="-7" rx="3.2" ry="1.8" fill="url(#lavenderLight)" transform="rotate(-20)"/>
        <ellipse cx="3.5" cy="-8" rx="3.2" ry="1.8" fill="url(#lavenderGrad)" transform="rotate(20)"/>
        <ellipse cx="0" cy="-14" rx="2.5" ry="3" fill="url(#lavenderLight)"/>
