    <g transform="translate(258, 12)">
        <ellipse cx="-4.5" cy="0" rx="4.2" ry="2.2" fill="url(#lavenderGrad)" transform="rotate(-30)"/>
        <ellipse cx="4.5" cy="-1" rx="4.2" ry="2.2" fill="url(#lavenderLight)" transform="rotate(30)"/>
        <ellipse cx="-4" cy="-6" rx="3.8" ry="2" fill="url(#lavenderLight)" transform="rotate(-25)"/>
        <ellipse cx="4" cy="-7" rx="3.8" ry="2" fill="url(#lavenderGrad)" transform="rotate(25)"/>
        <ellipse cx="-3.5" cy="-12" rx="3.2" ry="1.8" fill="url(#lavenderGrad)" transform="rotate(-20)"/>
        <ellipse cx="3.5" cy="-13" rx="3.2" ry="1.8" fill="url(#lavenderLight)" transform="rotate(20)"/>
        <ellipse cx="0" cy="-19" rx="2.6" ry="3.6" fill="url(#lavenderLight)"/>
