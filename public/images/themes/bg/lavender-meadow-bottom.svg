    <!-- Floating Lavender Butterflies -->
    <!-- Butterfly 1 (Left) -->
    <g transform="translate(95, 12) scale(0.7) rotate(-15)">
        <path d="M0,0 C-8,-10 -14,-4 -6,4 C-2,8 0,4 0,0 Z" fill="#B497D6" fill-opacity="0.9"/>
        <path d="M0,0 C8,-10 14,-4 6,4 C2,8 0,4 0,0 Z" fill="#D3C0EB" fill-opacity="0.95"/>
        <path d="M0,0 C-7,4 -10,12 -3,10 C0,8 0,2 0,0 Z" fill="#8F72B5" fill-opacity="0.85"/>
        <path d="M0,0 C7,4 10,12 3,10 C0,8 0,2 0,0 Z" fill="#A88BCF" fill-opacity="0.9"/>
        <line x1="0" y1="-6" x2="0" y2="8" stroke="#503572" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Butterfly 2 (Center-Right) -->
    <g transform="translate(435, 10) scale(0.85) rotate(20)">
        <path d="M0,0 C-8,-10 -14,-4 -6,4 C-2,8 0,4 0,0 Z" fill="#C5ADE0" fill-opacity="0.95"/>
        <path d="M0,0 C8,-10 14,-4 6,4 C2,8 0,4 0,0 Z" fill="#E4D6F7" fill-opacity="0.95"/>
        <path d="M0,0 C-7,4 -10,12 -3,10 C0,8 0,2 0,0 Z" fill="#987CBD" fill-opacity="0.85"/>
        <path d="M0,0 C7,4 10,12 3,10 C0,8 0,2 0,0 Z" fill="#B59BD9" fill-opacity="0.9"/>
        <line x1="0" y1="-6" x2="0" y2="8" stroke="#503572" stroke-width="1.2" stroke-linecap="round"/>
