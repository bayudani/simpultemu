    <path d="M56 16 C58 8 64 6 67 8 C65 14 59 16 56 16Z" fill="#7A1C28" opacity="0.85"/>
    <path d="M82 24 C88 18 94 18 96 22 C92 26 86 26 82 24Z" fill="#8B2635" opacity="0.85"/>
    <path d="M88 48 C95 48 98 52 97 56 C92 56 88 52 88 48Z" fill="#7A1C28" opacity="0.85"/>
    <path d="M87 82 C93 84 94 88 92 91 C88 90 86 86 87 82Z" fill="#7A1C28" opacity="0.85"/>
    <path d="M48 24 C52 28 56 28 55 25 C52 22 48 24 48 24Z" fill="#D4AF37" opacity="0.8"/>
    <path d="M78 52 C84 56 86 60 84 61 C81 59 78 55 78 52Z" fill="#D4AF37" opacity="0.8"/>

    <!-- Dainty Flower 1 (Apex Shoulder - Diameter ~15px) -->
    <g transform="translate(70, 36)">
        <circle cx="0" cy="-5" r="3.2" fill="#7A1C28"/>
        <circle cx="4.8" cy="-1.5" r="3.2" fill="#7A1C28"/>
        <circle cx="3" cy="4" r="3.2" fill="#7A1C28"/>
        <circle cx="-3" cy="4" r="3.2" fill="#7A1C28"/>
        <circle cx="-4.8" cy="-1.5" r="3.2" fill="#7A1C28"/>
        <circle cx="0" cy="0" r="1.8" fill="#E5C378"/>
    </g>

    <!-- Dainty Flower 2 (Upper Curve - Diameter ~12px) -->
    <g transform="translate(42, 20)">
        <circle cx="0" cy="-4" r="2.5" fill="#8B2635"/>
        <circle cx="3.8" cy="-1.2" r="2.5" fill="#8B2635"/>
        <circle cx="2.4" cy="3.2" r="2.5" fill="#8B2635"/>
