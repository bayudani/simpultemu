    <!-- Golden Berry Accents -->
    <circle cx="20" cy="18" r="1.5" fill="#D4AF37"/>
    <circle cx="58" cy="12" r="1.5" fill="#D4AF37"/>
    <circle cx="92" cy="38" r="1.8" fill="#D4AF37"/>
    <circle cx="94" cy="74" r="1.5" fill="#D4AF37"/>
