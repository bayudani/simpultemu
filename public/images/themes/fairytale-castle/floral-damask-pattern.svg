<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" opacity="0.16">
  <defs>
    <style>
      .fl { fill: #B83258; }
      .st { stroke: #B83258; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <!-- Center Rose Ornament -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="fl"/>
    <!-- Petals -->
    <path d="M0 -5 C-6 -14, 6 -14, 0 -5 Z" class="fl"/>
    <path d="M0 5 C-6 14, 6 14, 0 5 Z" class="fl"/>
    <path d="M-5 0 C-14 -6, -14 6, -5 0 Z" class="fl"/>
    <path d="M5 0 C14 -6, 14 6, 5 0 Z" class="fl"/>
    <path d="M-4 -4 C-12 -12, -4 -16, -4 -4 Z" class="fl"/>
    <path d="M4 4 C12 12, 4 16, 4 4 Z" class="fl"/>
    <path d="M-4 4 C-12 12, -16 4, -4 4 Z" class="fl"/>
    <path d="M4 -4 C12 -12, 16 -4, 4 -4 Z" class="fl"/>
    <!-- Flourish Curves -->
    <path d="M0 -15 C-18 -32, -32 -18, -15 0 C-32 18, -18 32, 0 15 C18 32, 32 18, 15 0 C32 -18, 18 -32, 0 -15 Z" class="st"/>
    <!-- Tiny Dots -->
    <circle cx="-25" cy="0" r="1.5" class="fl"/>
    <circle cx="25" cy="0" r="1.5" class="fl"/>
    <circle cx="0" cy="-25" r="1.5" class="fl"/>
    <circle cx="0" cy="25" r="1.5" class="fl"/>
  </g>
  <!-- Corner Rose Flourishes (Seamless Tile Matching) -->
  <g transform="translate(0, 0)">
    <circle cx="0" cy="0" r="3" class="fl"/>
    <path d="M0 0 C15 0, 20 15, 0 20 Z" class="fl"/>
    <path d="M0 0 C0 15, 15 20, 20 0 Z" class="fl"/>
    <path d="M0 0 C25 8, 25 25, 8 25 Z" class="st"/>
  </g>
  <g transform="translate(160, 0)">
    <circle cx="0" cy="0" r="3" class="fl"/>
    <path d="M0 0 C-15 0, -20 15, 0 20 Z" class="fl"/>
    <path d="M0 0 C0 15, -15 20, -20 0 Z" class="fl"/>
    <path d="M0 0 C-25 8, -25 25, -8 25 Z" class="st"/>
  </g>
  <g transform="translate(0, 160)">
    <circle cx="0" cy="0" r="3" class="fl"/>
    <path d="M0 0 C15 0, 20 -15, 0 -20 Z" class="fl"/>
    <path d="M0 0 C0 -15, 15 -20, 20 0 Z" class="fl"/>
    <path d="M0 0 C25 -8, 25 -25, 8 -25 Z" class="st"/>
  </g>
  <g transform="translate(160, 160)">
    <circle cx="0" cy="0" r="3" class="fl"/>
    <path d="M0 0 C-15 0, -20 -15, 0 -20 Z" class="fl"/>
    <path d="M0 0 C0 -15, -15 -20, -20 0 Z" class="fl"/>
    <path d="M0 0 C-25 -8, -25 -25, -8 -25 Z" class="st"/>
  </g>
  <!-- Intermediate Leaves -->
  <path d="M40 40 Q48 30 52 40 Q40 48 40 40 Z" class="fl"/>
  <path d="M120 40 Q112 30 108 40 Q120 48 120 40 Z" class="fl"/>
  <path d="M40 120 Q48 130 52 120 Q40 112 40 120 Z" class="fl"/>
  <path d="M120 120 Q112 130 108 120 Q120 112 120 120 Z" class="fl"/>
</svg>
